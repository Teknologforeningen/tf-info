name: Docker Image CI

on:
  push:
    branches: 
      - develop
      - testing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: teknologforeningen/tf-info

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag
        run: |
          if [ "${{ github.ref_name }}" = "develop" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          elif [ "${{ github.ref_name }}" = "testing" ]; then
            echo "IMAGE_TAG=testing" >> $GITHUB_ENV
          fi

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Push the Docker image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
